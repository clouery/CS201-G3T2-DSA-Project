# RQ4 - classic static TSP tour vs time-dependent tours, travelled on the timetable.
cities=10,20,30,40
headway=30
buffer=5
localSearchPasses=3
# Seeds change the generated network (lines, modes) and the random query set.
seeds=1,2,3,4,5
