# Network and schedule generation parameters.
# Every fabricated attribute is documented in data/processed/network_report.md.

seed=42

# Sparse geometric graph
knn.k=3

# Lines
line.count=10
line.minStops=4
line.maxStops=8

# Mode: bus when the line's longest segment is below the threshold, train otherwise
mode.thresholdKm=200
speed.busKmh=60
speed.trainKmh=100

# Departures
headway.busMin=30
headway.trainMin=60
service.firstMin=360
service.lastMin=1320

# Same-stop transfers only (v1)
transfer.bufferMin=5
